name: Installed Android journeys
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 47 6 * * 3
permissions:
  contents: read
concurrency:
  group: journeys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    name: ${{ matrix.surface }} fixture journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: wear
            api: 34
            target: android-wear
            profile: wearos_small_round
            task: :app-wear:connectedDebugAndroidTest
            filter: com.nedrichards.brooklet.wear.InboxRefreshLayoutTest
            package: com.nedrichards.brooklet.dev
    env:
      TEST_TASK: ${{ matrix.task }}
      TEST_CLASSES: ${{ matrix.filter }}
      TEST_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Enable hosted emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run fixture journeys in the installed test APK
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            test_exit=0
            filter=()
            if [[ -n "$TEST_CLASSES" ]]; then filter+=("-Pandroid.testInstrumentationRunnerArguments.class=$TEST_CLASSES"); fi
            ./gradlew --no-daemon "$TEST_TASK" "${filter[@]}" || test_exit=$?
            mkdir -p .ci-results/fixtures
            adb logcat -d -v brief '*:E' > .ci-results/emulator-errors.log || true
            for name in wear-refresh-ready.png wear-refresh-arrival.png wear-refresh-running.png; do
              if adb shell run-as "$TEST_PACKAGE" test -f "cache/$name"; then
                adb exec-out run-as "$TEST_PACKAGE" cat "cache/$name" > ".ci-results/fixtures/$name"
              fi
            done
            exit "$test_exit"
      - name: Summarize instrumentation and emulator outcomes
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: python3 scripts/ci/android-journey-summary.py
      - name: Preserve journey reports and fixture captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: brooklet-android-journeys-${{ matrix.surface }}-${{ github.sha }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            .ci-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
