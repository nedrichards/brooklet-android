name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ !github.event.repository.private || vars.GH_CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  feature-availability:
    if: ${{ github.event.repository.private && vars.GH_CODE_SECURITY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain private repository security coverage
        run: |
          echo '::notice::Dependency review and CodeQL require GitHub Code Security for private repositories.'
          echo 'Dependency review and CodeQL are unavailable without GitHub Code Security on this private repository. Dependabot version updates, vulnerability alerts, resolved dependency submission, tests and lint remain enabled. After enabling the licensed feature, set GH_CODE_SECURITY_ENABLED=true to activate the extra checks.' >> "$GITHUB_STEP_SUMMARY"
