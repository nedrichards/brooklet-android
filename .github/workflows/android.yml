name: Android checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Verify source and release build
        run: >-
          ./gradlew --no-daemon
          :core-model:test :core-network:test :core-sync:test
          :app-phone:testDebugUnitTest :app-wear:testDebugUnitTest lintDebug lintRelease
          :app-phone:assembleDebug :app-wear:assembleDebug
          :app-phone:assembleRelease :app-wear:assembleRelease
      - name: Verify Wear capabilities survive release shrinking
        run: |
          unzip -p app/build/outputs/apk/release/app-phone-release*.apk resources.arsc | strings | grep -Fq brooklet_phone_provisioning
          unzip -p app-wear/build/outputs/apk/release/app-wear-release*.apk resources.arsc | strings | grep -Fq brooklet_watch_provisioning
      - name: Upload installable debug APK
        id: upload-apk
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brooklet-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable Wear debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brooklet-wear-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app-wear/build/outputs/apk/debug/app-wear-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Link debug APK from the job summary
        if: ${{ success() }}
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
          ARTIFACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "### Installable debug APK"
            echo
            echo "[Download Brooklet debug APK](${ARTIFACT_URL})"
            echo
            echo "\`${ARTIFACT_SHA}\` · retained for 14 days · GitHub sign-in required"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize verification
        if: always()
        run: python3 .github/scripts/verification-summary.py
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release build APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-apks-${{ github.sha }}
          path: '**/build/outputs/apk/**/release/*.apk'
          if-no-files-found: error
          retention-days: 14

  keyboard:
    name: Keyboard and mouse journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Hosted emulator graphics and boot failures are intermittent; keep the
    # journey reports visible without making them a release gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify keyboard, mouse and existing touch journeys
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app-phone:connectedDebugAndroidTest
            adb shell wm size 1600x1000
            adb shell wm density 240
            sleep 8
            ./gradlew --no-daemon :app-phone:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nedrichards.brooklet.KeyboardJourneyTest
      - name: Summarize Android journey results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          reports = Path("app/build/outputs/androidTest-results/connected")
          lines = ["## Android journey test results (advisory)", ""]
          files = sorted(reports.rglob("TEST-*.xml")) if reports.exists() else []
          if not files:
              lines.append("No connected Android test XML reports were produced.")
          else:
              failures = []
              tests = failed = skipped = 0
              for report in files:
                  root = ElementTree.parse(report).getroot()
                  for suite in root.iter("testsuite"):
                      tests += int(suite.attrib.get("tests", 0))
                      failed += int(suite.attrib.get("failures", 0)) + int(suite.attrib.get("errors", 0))
                      skipped += int(suite.attrib.get("skipped", 0))
                      for case in suite.findall("testcase"):
                          issue = case.find("failure")
                          if issue is None:
                              issue = case.find("error")
                          if issue is not None:
                              details = (issue.text or "").strip()
                              failures.append((case.attrib.get("classname", suite.attrib.get("name", "test")), case.attrib.get("name", "unknown"), details))
              lines.append(f"{tests} tests, {failed} failures, {skipped} skipped.")
              if failures:
                  lines.extend(["", "### Failures", ""])
                  for classname, name, details in failures:
                      lines.append(f"- `{classname}.{name}`")
                      if details:
                          lines.append("  ```text")
                          lines.extend(f"  {line}" for line in details.splitlines()[:12])
                          lines.append("  ```")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Upload journey reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brooklet-input-journey-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Draft development APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*debug*'
          path: artifacts
      - name: Prepare labelled APKs and checksums
        run: |
          mkdir release-apks
          python3 - <<'SCRIPT'
          from pathlib import Path
          import shutil
          for apk in Path('artifacts').rglob('*.apk'):
              name = '-'.join(apk.relative_to('artifacts').parts)
              shutil.copy2(apk, Path('release-apks') / name)
          if not list(Path('release-apks').glob('*.apk')):
              raise SystemExit('No debug APKs were downloaded')
          SCRIPT
          cd release-apks
          sha256sum *.apk > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-apks/* --verify-tag --draft \
            --title "$RELEASE_TAG development APKs" \
            --notes "Verified debug APKs for installation and testing. Signed with a disposable CI debug key; updates from other builds may require reinstalling. Production-signed distribution requires the app's release keystore and versioning procedure. SHA256SUMS is attached."
