name: Android checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source and release build
        run: >-
          ./gradlew --no-daemon
          :core-model:test :core-network:test :core-sync:test
          :app-phone:testDebugUnitTest :app-wear:testDebugUnitTest lintDebug
          :app-phone:assembleDebug :app-wear:assembleDebug
          :app-phone:assembleRelease :app-wear:assembleRelease
      - name: Verify Wear capabilities survive release shrinking
        run: |
          unzip -p app/build/outputs/apk/release/app-phone-release*.apk resources.arsc | strings | grep -Fq brooklet_phone_provisioning
          unzip -p app-wear/build/outputs/apk/release/app-wear-release*.apk resources.arsc | strings | grep -Fq brooklet_watch_provisioning
      - name: Upload installable debug APK
        id: upload-apk
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brooklet-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload installable Wear debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brooklet-wear-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app-wear/build/outputs/apk/debug/app-wear-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Link debug APK from the job summary
        if: ${{ success() }}
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
          ARTIFACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "### Installable debug APK"
            echo
            echo "[Download Brooklet debug APK](${ARTIFACT_URL})"
            echo
            echo "\`${ARTIFACT_SHA}\` · retained for 14 days · GitHub sign-in required"
          } >> "$GITHUB_STEP_SUMMARY"

  keyboard:
    name: Keyboard and mouse journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify keyboard, mouse and existing touch journeys
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app-phone:connectedDebugAndroidTest
            adb shell wm size 2560x1600
            adb shell wm density 320
            sleep 3
            ./gradlew --no-daemon :app-phone:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nedrichards.brooklet.KeyboardJourneyTest
      - name: Upload journey reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brooklet-input-journey-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
